<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 운세 · 사주</title>
<meta name="description" content="생년월일·태어난 시간·성별로 사주와 오늘의 운세를 알려주는 무료 웹앱">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <header class="app__header">
    <div class="app__moon">🌙</div>
    <h1>오늘의 운세</h1>
    <p class="app__subtitle" id="todayLabel"></p>
  </header>

  <section class="card" id="formCard">
    <label for="birthdate">생년월일</label>
    <input type="date" id="birthdate" required>

    <label for="birthtime">태어난 시간</label>
    <input type="time" id="birthtime">
    <label class="checkbox">
      <input type="checkbox" id="timeUnknown">
      <span>태어난 시간을 몰라요</span>
    </label>

    <label>성별</label>
    <div class="radio-group">
      <label class="radio"><input type="radio" name="gender" value="남성" checked><span>남성</span></label>
      <label class="radio"><input type="radio" name="gender" value="여성"><span>여성</span></label>
    </div>

    <button id="showBtn">사주 & 오늘의 운세 보기 ✨</button>
  </section>

  <section class="card result" id="resultCard" hidden>
    <div class="result__top">
      <div class="result__zodiac" id="zodiacEmoji"></div>
      <div class="result__zodiacName" id="zodiacName"></div>
    </div>

    <div class="saju">
      <span class="result__label">나의 사주 (四柱)</span>
      <div class="saju__grid" id="sajuGrid"></div>
      <p class="saju__note" id="sajuTimeNote"></p>
    </div>

    <div class="saju__daymaster">
      <span class="result__label">일간(日干) · 나의 타고난 기질</span>
      <p class="result__text" id="dayMasterText"></p>
    </div>

    <div class="saju__elements">
      <span class="result__label">오행(五行) 분포</span>
      <div class="elements__bar" id="elementsBar"></div>
      <div class="elements__legend" id="elementsLegend"></div>
    </div>

    <div class="saju__daeun">
      <span class="result__label">대운(大運) 방향</span>
      <p class="result__text" id="daeunText"></p>
    </div>

    <div class="result__item">
      <span class="result__label">총운</span>
      <p class="result__text" id="fortuneGeneral"></p>
    </div>
    <div class="result__item">
      <span class="result__label">애정운</span>
      <p class="result__text" id="fortuneLove"></p>
    </div>
    <div class="result__item">
      <span class="result__label">금전운</span>
      <p class="result__text" id="fortuneMoney"></p>
    </div>
    <div class="result__item">
      <span class="result__label">건강운</span>
      <p class="result__text" id="fortuneHealth"></p>
    </div>

    <div class="result__badges">
      <div class="badge">
        <span class="badge__label">행운의 색</span>
        <span class="badge__value" id="luckyColor"></span>
      </div>
      <div class="badge">
        <span class="badge__label">행운의 숫자</span>
        <span class="badge__value" id="luckyNumber"></span>
      </div>
    </div>

    <div class="advice">
      <span class="advice__label">오늘의 한마디</span>
      <p class="advice__text" id="advice"></p>
    </div>

    <div class="monthly result__item">
      <span class="result__label">월별 운세</span>
      <p class="monthly__desc" id="monthlyYearLabel"></p>
      <button id="monthlyToggleBtn" class="monthly__toggle">월별 운세 펼쳐보기 ▾</button>
      <div class="monthly__grid" id="monthlyGrid" hidden></div>
    </div>

    <button id="backBtn">다시 입력하기</button>
  </section>

  <footer class="app__footer">
    <p>매일 자정에 새로운 운세로 바뀌어요 · 같은 날엔 같은 결과예요</p>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
